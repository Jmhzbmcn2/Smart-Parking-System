[project]
name = "backend"
version = "0.1.0"
description = "SPMS backend skeleton"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.143.3",
    "sqlalchemy>=2.1.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
